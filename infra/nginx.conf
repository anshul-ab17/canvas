# Canvas — nginx reverse proxy for the API/WebSocket server (apps/server on :3002).
# Frontend is on Vercel; nginx only fronts the backend.
#
# Install: copy to /etc/nginx/sites-available/canvas, symlink into sites-enabled,
# set server_name, then run certbot --nginx to add TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name api.example.com;  # <- your domain

    # allow room for auth payloads; server itself caps JSON at 256kb
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket upgrade (same port serves REST + WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # long-lived WS connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
